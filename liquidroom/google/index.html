<script>
(function () {
  var EVENT = /*EVENT_DATA*/{
  "text": "The R.O.X＆GWO ONE-MAN LIVE「ロックス！夢をみせてくれ！」LIQUIDROOM 17:00 Start",

  "ctz": "Asia/Tokyo"
}/*END_EVENT_DATA*/;

  var params = new URLSearchParams();
  params.set('action', 'TEMPLATE');
  params.set('text', EVENT.text);
  params.set('dates', EVENT.dates);
  params.set('details', EVENT.details);
  params.set('location', EVENT.location);
  params.set('ctz', EVENT.ctz);
  var redirectUrl = 'https://calendar.google.com/calendar/render?' + params.toString();
  document.getElementById('manual').href = redirectUrl;

  // LINEアプリ内ブラウザでは外部ブラウザで開き直す（Googleログインが弾かれるため）。
  // 計測は外部ブラウザ側で1回だけ行う。
  if (/\bLine\//i.test(navigator.userAgent) && !/[?&]openExternalBrowser=1\b/.test(location.search)) {
    location.replace(location.pathname + '?openExternalBrowser=1');
    return;
  }

  var moved = false;
  function redirect() {
    if (moved) return;
    moved = true;
    window.location.replace(redirectUrl);
  }

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'calendar_add',
    calendar_type: 'google',
    live_id: 'liquidroom_20270523',
    eventCallback: redirect,
    eventTimeout: 1000
  });

  // GTMが広告ブロック等で読み込まれない場合の保険
  setTimeout(redirect, 1400);
})();
</script>
